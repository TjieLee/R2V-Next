# =============================================================================
# LTX-2 Multi-Reference Image + Text Stage 2 VLM Planner Training
# =============================================================================
#
# Stage 2 freezes the Stage 1 multi-reference renderer and Gemma backbone by default.
# It trains only the lightweight planner path:
#   1. LTX thinking/register tokens through the video connector
#   2. Baton-style <image_start> + <image_pad>*K + <image_end> planner slots
#   3. zero-init cross-attention + FFN bridge whose Q is repeated LTX thinking/register tokens
#   4. Optional LTX video text connector refinement
#
# Set training_strategy.train_gemma_backbone: true only when you explicitly want
# to fine-tune the Gemma language-model backbone.
#
# The DiT condition sequence remains:
#   VLM text/reference-image context tokens + visual tokens
# Stage 1 uses target-video GT visual tokens from frozen SigLIP/projector.
# Stage 2 replaces those GT tokens with VLM-predicted visual tokens and aligns
# them to GT with MSE. planner_token_count must equal the target-video GT visual
# token count. If precompute_gt_siglip_tokens.py logs "Detected 2048 GT visual
# tokens per sample", use planner_token_count: 2048. Reference image count does
# not define this value.
#
# Required preprocessed layout:
#   preprocessed_data_root/
#   ├── latents/                    # Target video VAE latents
#   ├── vlm_conditions/             # VLM context from system prompt + user prompt + reference images
#   ├── conditions/                 # Optional fallback: text-only embeddings
#   ├── multi_reference_latents/    # Stage 1 reference image latents
#   ├── gt_siglip_tokens/           # frozen target-video SigLIP/projector visual tokens
#   └── planner_vlm_inputs/         # tokenized VLM inputs with fixed planner placeholders
#
# planner_vlm_inputs/*.pt format:
#   {
#     "input_ids": LongTensor[L],
#     "attention_mask": LongTensor[L],
#     "pixel_values": Optional Tensor[I, C, H, W],
#     "planner_placeholder_mask": BoolTensor[L],  # exactly planner_token_count true values
#     "planner_region_mask": BoolTensor[L],
#     "planner_boundary_mask": BoolTensor[L],
#     "ref_visual_token_mask": BoolTensor[L],     # pure source reference image-pad positions
#     "ref_image_region_mask": BoolTensor[L],     # source reference image boundaries + image pads
#     "gt_image_token_mask": BoolTensor[L],       # legacy alias for ref_image_region_mask
#     "text_token_mask": BoolTensor[L],           # system/user/template text tokens; old caches infer this at runtime
#     "source_max_length": LongTensor[],
#     "ref_visual_token_count": LongTensor[],
#     "labels": Optional LongTensor[L],
#     "num_ref_images": LongTensor[],
#   }

model:
  model_path: "path/to/ltx-2-model.safetensors"
  text_encoder_path: "path/to/gemma-text-encoder"
  training_mode: "lora"
  # Point this to the Stage 1 LoRA checkpoint when continuing from Stage 1.
  load_checkpoint: "path/to/stage1/lora_weights_step_XXXXX.safetensors"

lora:
  rank: 128
  alpha: 128
  dropout: 0.0
  target_modules:
    - "attn1.to_k"
    - "attn1.to_q"
    - "attn1.to_v"
    - "attn1.to_out.0"
    - "attn2.to_k"
    - "attn2.to_q"
    - "attn2.to_v"
    - "attn2.to_out.0"
    - "ff.net.0.proj"
    - "ff.net.2"

text_encoder_lora:
  enabled: true
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

training_strategy:
  name: "multi_reference_planner_stage2"
  conditions_dir: "vlm_conditions"
  reference_latents_dir: "multi_reference_latents"
  gt_visual_tokens_dir: "gt_siglip_tokens"
  visual_token_key: "visual_tokens"
  visual_token_mask_key: "visual_token_mask"
  visual_tokens_per_frame_key: "tokens_per_frame"
  visual_token_frame_stride: 1
  visual_token_source_dim: 3840
  visual_token_target_dim: 4096
  cfg_dropout_enabled: true
  cfg_full_p: 0.65
  cfg_drop_text_p: 0.1
  cfg_drop_siglip_p: 0.1
  cfg_drop_ref_latents_p: 0.1
  cfg_drop_ref_p: 0.0
  cfg_drop_all_p: 0.05
  cfg_drop_planner_p: 0.0
  cfg_text_conditions_dir: "conditions"
  cfg_ref_only_conditions_dir: null
  planner_conditions_dir: "planner_conditions"
  use_online_vlm: true
  planner_vlm_inputs_dir: "planner_vlm_inputs"
  max_ref_images_per_sample: null
  reference_time_stride: 1.0
  first_frame_conditioning_p: 0.0

  vlm_placeholder_mask_key: "planner_placeholder_mask"
  vlm_hidden_layer: -1
  vlm_lm_labels_key: "ntp_labels"
  train_gemma_backbone: false
  freeze_vlm_vision_tower: true
  freeze_vlm_multi_modal_projector: true

  # Set this to the exact num_visual_tokens detected by precompute_gt_siglip_tokens.py.
  # Your current log showed 2048 GT visual tokens per sample; if you rerun GT
  # extraction with 4 sampled frames, change this back to 1024.
  planner_token_count: 2048
  planner_cross_attention_heads: 16
  planner_cross_attention_dropout: 0.0
  planner_zero_init_cross_attention: false
  planner_ffn_multiplier: 4.0
  planner_ffn_dropout: 0.0
  planner_zero_init_ffn: false
  planner_slot_encoding: true
  # Tiny random per-slot offset that breaks repeated LTX register-query symmetry.
  # Set to 0.0 to recover the exact previous all-zero slot encoding behavior.
  planner_slot_init_std: 1.0e-4
  planner_slot_init_seed: 0
  # Set this if the selected VLM hidden layer dim differs from the LTX connector input dim (default 3840).
  planner_source_dim: 3840
  planner_output_dim: 3840
  planner_use_content_residual: true
  planner_use_3d_rope: true
  planner_rope_use_middle_positions: true
  planner_residual_init_gain: 0.1
  predicted_visual_token_key: "predicted_visual_tokens"
  predicted_visual_token_mask_key: "predicted_visual_token_mask"
  siglip_loss_weight: 1.0
  ntp_loss_weight: 0.1
  ntp_logits_chunk_size: 128
  flow_loss_weight: 1.0
  freeze_transformer: true
  train_text_connector: true
  gemma_gradient_checkpointing: true
  gemma_gradient_checkpointing_use_reentrant: false

optimization:
  learning_rate: 5e-5
  steps: 2000
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "linear"
  scheduler_params: {}
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: null
  load_text_encoder_in_8bit: false
  offload_optimizer_during_validation: false

data:
  preprocessed_data_root: "/mnt/workspace/litengjie/my_dataset/.precomputed"
  num_dataloader_workers: 2

validation:
  interval: null
  skip_initial_validation: true
  generate_audio: false
  generate_video: true

checkpoints:
  interval: 500
  keep_last_n: 2
  precision: "bfloat16"
  no_resume: true
  save_training_state: "minimal"

hub:
  push_to_hub: false
  hub_model_id: null

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

wandb:
  enabled: false
  project: "ltx2-multiref"
  entity: null
  tags:
    - "multi-reference"
    - "stage2-planner"
  log_validation_videos: false

seed: 42
output_dir: "/mnt/workspace/litengjie/ltx2_multiref_stage2_outputs"
