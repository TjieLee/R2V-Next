# Stage 3 jointly tunes the Stage 1 DiT LoRA and all Stage 2 planner modules.
model:
  model_path: "/mnt/workspace/litengjie/LTX-2/models/LTX-2.3/ltx-2.3-22b-dev.safetensors"
  text_encoder_path: "/mnt/workspace/litengjie/LTX-2/models/gemma-3-12b-it-qat-q4_0-unquantized"
  training_mode: "lora"
  load_checkpoint: "/mnt/workspace/litengjie/ltx2_multiref_stage2_full_tokens_planner_2048/checkpoints/lora_weights_step_10000.safetensors"

lora:
  rank: 128
  alpha: 128
  dropout: 0.0
  target_modules:
    - "attn1.to_k"
    - "attn1.to_q"
    - "attn1.to_v"
    - "attn1.to_out.0"
    - "attn2.to_k"
    - "attn2.to_q"
    - "attn2.to_v"
    - "attn2.to_out.0"
    - "ff.net.0.proj"
    - "ff.net.2"

text_encoder_lora:
  enabled: true
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

training_strategy:
  name: "multi_reference_planner_stage2"
  training_phase: "stage3"
  train_stage1_dit_lora: true
  conditions_dir: "vlm_conditions"
  cfg_text_conditions_dir: "conditions"
  reference_latents_dir: "multi_reference_latents"
  gt_visual_tokens_dir: "gt_siglip_tokens"
  planner_vlm_inputs_dir: "planner_vlm_inputs"
  use_online_vlm: true

  planner_token_count: 2048
  planner_source_dim: 3840
  planner_output_dim: 3840
  planner_cross_attention_heads: 16
  planner_cross_attention_dropout: 0.0
  planner_use_content_residual: true
  planner_use_3d_rope: true
  planner_rope_use_middle_positions: true
  planner_slot_encoding: true
  planner_slot_init_std: 1.0e-4
  planner_slot_init_seed: 0
  planner_query_init_std: 1.0e-4
  planner_zero_init_cross_attention: false
  planner_zero_init_ffn: false
  planner_residual_init_gain: 0.1
  planner_query_chunk_size: 256

  visual_token_source_dim: 3840
  visual_token_target_dim: 4096
  visual_branch_enabled: true
  visual_context_mode: "full_tokens_3d_sa"
  visual_context_expected_tokens: 2048
  visual_context_max_tokens: 2048
  visual_full_sa_num_heads: 32
  visual_full_sa_depth: 1
  visual_full_sa_ffn_multiplier: 2.0
  visual_full_sa_dropout: 0.0
  visual_full_sa_residual_init_gain: 0.1
  visual_full_sa_use_middle_positions: true
  visual_connector_enabled: false

  freeze_transformer: true
  train_text_connector: true
  train_gemma_backbone: false
  freeze_vlm_vision_tower: true
  freeze_vlm_multi_modal_projector: true
  gemma_gradient_checkpointing: true
  gemma_gradient_checkpointing_use_reentrant: false

  ntp_loss_weight: 0.1
  siglip_loss_weight: 1.0
  flow_loss_weight: 1.0
  ntp_logits_chunk_size: 128

  cfg_dropout_enabled: true
  cfg_full_p: 0.65
  cfg_drop_text_p: 0.10
  cfg_drop_siglip_p: 0.05
  cfg_drop_ref_latents_p: 0.15
  cfg_drop_all_p: 0.05
  cfg_drop_ref_p: 0.0
  cfg_drop_planner_p: 0.0

  max_ref_images_per_sample: null
  reference_time_stride: 1.0
  first_frame_conditioning_p: 0.0

optimization:
  learning_rate: 1.0e-5
  steps: 2000
  batch_size: 1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "linear"
  scheduler_params: {}
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: null
  load_text_encoder_in_8bit: false
  offload_optimizer_during_validation: false

data:
  preprocessed_data_root: "/mnt/workspace/litengjie/my_dataset/overfit_2000/.precomputed"
  num_dataloader_workers: 2

validation:
  interval: null
  skip_initial_validation: true
  generate_audio: false
  generate_video: true

checkpoints:
  interval: 500
  keep_last_n: 4
  precision: "bfloat16"
  no_resume: true
  save_training_state: "minimal"
  allow_warm_resume_without_optimizer: false

hub:
  push_to_hub: false
  hub_model_id: null

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

wandb:
  enabled: false
  project: "ltx2-multiref"
  entity: null
  tags: ["multi-reference", "stage3-joint", "full-tokens-2048"]
  log_validation_videos: false

seed: 42
output_dir: "/mnt/workspace/litengjie/ltx2_multiref_stage3_joint_full_tokens_planner_2048"
