# =============================================================================
# LTX-2 Multi-Reference Stage 1 Full 2048-Token Visual Branch
# =============================================================================
# This mode starts a new visual branch from scratch. Do not warm-start it from
# a legacy qformer_512 Stage 1 checkpoint.

model:
  model_path: "/mnt/workspace/litengjie/LTX-2/models/LTX-2.3/ltx-2.3-22b-dev.safetensors"
  text_encoder_path: "/mnt/workspace/litengjie/LTX-2/models/gemma-3-12b-it-qat-q4_0-unquantized"
  training_mode: "lora"
  load_checkpoint: null

lora:
  rank: 128
  alpha: 128
  dropout: 0.0
  target_modules:
    - "attn1.to_k"
    - "attn1.to_q"
    - "attn1.to_v"
    - "attn1.to_out.0"
    - "attn2.to_k"
    - "attn2.to_q"
    - "attn2.to_v"
    - "attn2.to_out.0"
    - "ff.net.0.proj"
    - "ff.net.2"

training_strategy:
  name: "multi_reference_video"
  conditions_dir: "vlm_conditions"
  reference_latents_dir: "multi_reference_latents"
  gt_visual_tokens_dir: "gt_siglip_tokens"

  visual_token_key: "visual_tokens"
  visual_token_mask_key: "visual_token_mask"
  visual_tokens_per_frame_key: "tokens_per_frame"
  visual_token_frame_stride: 1
  visual_token_source_dim: 3840
  visual_token_target_dim: 4096

  visual_branch_enabled: true
  visual_context_mode: "full_tokens_3d_sa"
  visual_context_expected_tokens: 2048
  visual_context_max_tokens: 2048
  visual_full_sa_num_heads: 32
  visual_full_sa_depth: 1
  visual_full_sa_ffn_multiplier: 2.0
  visual_full_sa_dropout: 0.0
  visual_full_sa_residual_init_gain: 0.1
  visual_full_sa_use_middle_positions: true
  visual_connector_enabled: false
  train_text_connector: false

  cfg_dropout_enabled: true
  cfg_full_p: 0.40
  cfg_drop_text_p: 0.30
  cfg_drop_siglip_p: 0.15
  cfg_drop_ref_latents_p: 0.05
  cfg_drop_all_p: 0.10

  max_ref_images_per_sample: null
  reference_time_stride: 1.0
  first_frame_conditioning_p: 0.0

optimization:
  learning_rate: 5e-5
  steps: 10000
  batch_size: 1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "linear"
  scheduler_params: {}
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: null
  load_text_encoder_in_8bit: false
  offload_optimizer_during_validation: false

data:
  preprocessed_data_root: "/mnt/workspace/litengjie/my_dataset/overfit_2000/.precomputed"
  num_dataloader_workers: 2

validation:
  interval: null
  skip_initial_validation: true
  generate_audio: false
  generate_video: true

checkpoints:
  interval: 100
  keep_last_n: 3
  precision: "bfloat16"
  no_resume: false
  save_training_state: "minimal"

hub:
  push_to_hub: false
  hub_model_id: null

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

wandb:
  enabled: false
  project: "ltx2-multiref-overfit"
  entity: null
  tags:
    - "multi-reference"
    - "stage1"
    - "full-tokens-2048"
  log_validation_videos: false

seed: 42
output_dir: "/mnt/workspace/litengjie/ltx2_multiref_stage1_full_tokens_2048_2000"
