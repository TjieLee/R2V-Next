# =============================================================================
# LTX-2 Multi-Reference Image + Text Stage 1 LoRA Training
# =============================================================================
#
# Stage 1 trains the video renderer to consume:
#   1. text/thinking tokens from the normal LTX-2 Gemma text path
#   2. frozen target-video GT SigLIP/projector visual condition tokens
#   3. clean multi-reference image latent token segments prepended to the video stream
# Audio is disabled.
#
# Required preprocessed layout:
#   preprocessed_data_root/
#   ├── latents/                  # Target video VAE latents
#   ├── conditions/               # Text embeddings
#   ├── gt_siglip_tokens/         # Frozen target-video GT visual tokens from Gemma SigLIP/projector
#   └── multi_reference_latents/  # Stacked 1-N reference image latents per sample
#
# Build multi_reference_latents with:
#   python scripts/precompute_multiref_images.py dataset.json \
#     --model-path /path/to/ltx2.safetensors \
#     --target-latents-dir /path/to/.precomputed/latents \
#     --output-dir /path/to/.precomputed/multi_reference_latents \
#     --media-column video \
#     --reference-column reference_images
#
# Build gt_siglip_tokens with:
#   python scripts/precompute_gt_siglip_tokens.py dataset.json \
#     --text-encoder-path /path/to/gemma-text-encoder \
#     --output-dir /path/to/.precomputed/gt_siglip_tokens \
#     --video-column video \
#     --sample-fps 6 \
#     --max-source-frames 81

model:
  model_path: "path/to/ltx-2-model.safetensors"
  text_encoder_path: "path/to/gemma-text-encoder"
  training_mode: "lora"
  load_checkpoint: null

lora:
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules:
    - "attn1.to_k"
    - "attn1.to_q"
    - "attn1.to_v"
    - "attn1.to_out.0"
    - "attn2.to_k"
    - "attn2.to_q"
    - "attn2.to_v"
    - "attn2.to_out.0"

training_strategy:
  name: "multi_reference_video"
  reference_latents_dir: "multi_reference_latents"
  gt_visual_tokens_dir: "gt_siglip_tokens"
  visual_token_key: "visual_tokens"
  visual_token_mask_key: "visual_token_mask"
  visual_tokens_per_frame_key: "tokens_per_frame"
  visual_token_frame_stride: 1
  max_ref_images_per_sample: null
  reference_time_stride: 1.0
  first_frame_conditioning_p: 0.0

optimization:
  learning_rate: 1e-4
  steps: 3000
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "linear"
  scheduler_params: {}
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: null
  load_text_encoder_in_8bit: false
  offload_optimizer_during_validation: false

data:
  preprocessed_data_root: "/mnt/workspace/litengjie/path/to/.precomputed"
  num_dataloader_workers: 2

validation:
  interval: null
  skip_initial_validation: true
  generate_audio: false
  generate_video: true

checkpoints:
  interval: 500
  keep_last_n: 2
  precision: "bfloat16"
  no_resume: false
  save_training_state: "minimal"

hub:
  push_to_hub: false
  hub_model_id: null

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

wandb:
  enabled: false
  project: "ltx2-multiref"
  entity: null
  tags:
    - "multi-reference"
    - "stage1"
  log_validation_videos: false

seed: 42
output_dir: "/mnt/workspace/litengjie/ltx2_multiref_stage1_outputs"
