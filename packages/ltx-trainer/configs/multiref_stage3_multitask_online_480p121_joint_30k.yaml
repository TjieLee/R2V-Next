# Stage 3 jointly trains Stage 1 DiT LoRA plus the complete Stage 2 planner stack.
model:
  model_path: "/mnt/workspace/litengjie/LTX-2/models/LTX-2.3/ltx-2.3-22b-dev.safetensors"
  text_encoder_path: "/mnt/workspace/litengjie/LTX-2/models/gemma-3-12b-it-qat-q4_0-unquantized"
  training_mode: "lora"
  load_checkpoint: "/mnt/workspace/litengjie/jd_ltx_multitask_online_480p121/stage2/checkpoints/lora_weights_step_30000.safetensors"

lora:
  rank: 128
  alpha: 128
  dropout: 0.0
  target_modules: ["attn1.to_k", "attn1.to_q", "attn1.to_v", "attn1.to_out.0", "attn2.to_k", "attn2.to_q", "attn2.to_v", "attn2.to_out.0", "ff.net.0.proj", "ff.net.2"]

text_encoder_lora:
  enabled: true
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

training_strategy:
  name: "multi_reference_planner_stage2"
  training_phase: "stage3"
  train_stage1_dit_lora: true
  conditions_dir: "vlm_conditions"
  cfg_text_conditions_dir: "conditions"
  reference_latents_dir: "multi_reference_latents"
  gt_visual_tokens_dir: "gt_siglip_tokens"
  planner_vlm_inputs_dir: "planner_vlm_inputs"
  use_online_vlm: true
  vlm_output_mask_key: "planner_output_mask"
  planner_token_count: 2048
  planner_source_dim: 3840
  planner_output_dim: 3840
  planner_cross_attention_heads: 16
  planner_cross_attention_dropout: 0.0
  planner_use_content_residual: true
  planner_use_3d_rope: true
  planner_rope_use_middle_positions: true
  planner_slot_encoding: true
  planner_slot_init_std: 1.0e-4
  planner_slot_init_seed: 0
  planner_query_init_std: 1.0e-4
  planner_zero_init_cross_attention: false
  planner_zero_init_ffn: false
  planner_residual_init_gain: 0.1
  planner_query_chunk_size: 256
  visual_token_source_dim: 3840
  visual_token_target_dim: 4096
  visual_branch_enabled: true
  visual_context_mode: "full_tokens_3d_sa"
  visual_context_expected_tokens: 2048
  visual_context_max_tokens: 2048
  visual_full_sa_num_heads: 32
  visual_full_sa_depth: 1
  visual_full_sa_ffn_multiplier: 2.0
  visual_full_sa_dropout: 0.0
  visual_full_sa_residual_init_gain: 0.1
  visual_full_sa_use_middle_positions: true
  visual_connector_enabled: false
  freeze_transformer: true
  train_text_connector: true
  train_gemma_backbone: false
  freeze_vlm_vision_tower: true
  freeze_vlm_multi_modal_projector: true
  gemma_gradient_checkpointing: true
  gemma_gradient_checkpointing_use_reentrant: false
  ntp_loss_weight: 0.1
  siglip_loss_weight: 1.0
  flow_loss_weight: 1.0
  ntp_logits_chunk_size: 128
  cfg_dropout_enabled: true
  cfg_full_p: 0.65
  cfg_drop_text_p: 0.10
  cfg_drop_siglip_p: 0.05
  cfg_drop_ref_latents_p: 0.15
  cfg_drop_all_p: 0.05
  cfg_drop_ref_p: 0.0
  cfg_drop_planner_p: 0.0
  max_ref_images_per_sample: 4
  reference_time_stride: 1.0
  first_frame_conditioning_p: 0.0

optimization:
  learning_rate: 1.0e-5
  steps: 30000
  batch_size: 1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "linear"
  scheduler_params: {}
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: null
  load_text_encoder_in_8bit: false
  offload_optimizer_during_validation: false

data:
  encoding_mode: "online"
  train_data_config: "/mnt/workspace/litengjie/jd_ltx_multitask_online_480p121/manifests/multitask_480p121.yaml"
  manifest_path: "/mnt/workspace/litengjie/jd_ltx_multitask_online_480p121/manifests/train_unique.jsonl"
  num_dataloader_workers: 2
  online_encoding:
    width: 832
    height: 480
    image_num_frames: 1
    image_fps: 1.0
    video_num_frames: 121
    video_fps: 24.0
    vlm_video_frame_indices: [0, 17, 34, 51, 69, 86, 103, 120]
    visual_token_capacity: 2048
    tokens_per_frame: 256
    raw_visual_dim: 3840
    encoder_dtype: "bfloat16"
    encoder_device_policy: "resident_cuda"
    pin_memory: true
    prefetch_factor: 2
    planner_max_length: 4096
    max_ref_images: 4
    image_ratio: 0.3
    video_ratio: 0.7
    runtime_max_retries: 8
    runtime_reject_log_dir: "/mnt/workspace/litengjie/jd_ltx_multitask_online_480p121/logs"

validation: {interval: null, skip_initial_validation: true, generate_audio: false, generate_video: true}
checkpoints:
  interval: 2500
  keep_last_n: 2
  precision: "bfloat16"
  no_resume: true
  save_training_state: "full"
  allow_warm_resume_without_optimizer: false
hub: {push_to_hub: false, hub_model_id: null}
flow_matching: {timestep_sampling_mode: "shifted_logit_normal", timestep_sampling_params: {}}
wandb:
  enabled: false
  project: "jd-ltx-multitask-online-480p121"
  entity: null
  tags: ["multi-reference", "stage3", "online", "480p", "121f"]
  log_validation_videos: false
seed: 42
output_dir: "/mnt/workspace/litengjie/jd_ltx_multitask_online_480p121/stage3"
