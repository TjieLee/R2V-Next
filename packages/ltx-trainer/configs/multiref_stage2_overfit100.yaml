# =============================================================================
# LTX-2 Multi-Reference Stage 2 Planner 100-Sample Overfit Test
# =============================================================================
# Edit model.model_path, model.text_encoder_path, model.load_checkpoint and
# data.preprocessed_data_root before running on the training server.

model:
  model_path: "/mnt/workspace/litengjie/LTX-2/models/LTX-2.3/ltx-2.3-22b-dev.safetensors"
  text_encoder_path: "/mnt/workspace/litengjie/LTX-2/models/gemma-3-12b-it-qat-q4_0-unquantized"
  training_mode: "lora"
  load_checkpoint: "/mnt/workspace/litengjie/ltx2_multiref_overfit_stage1_100/checkpoints"

lora:
  rank: 128
  alpha: 128
  dropout: 0.0
  target_modules:
    - "attn1.to_k"
    - "attn1.to_q"
    - "attn1.to_v"
    - "attn1.to_out.0"
    - "attn2.to_k"
    - "attn2.to_q"
    - "attn2.to_v"
    - "attn2.to_out.0"

training_strategy:
  name: "multi_reference_planner_stage2"
  conditions_dir: "vlm_conditions"
  reference_latents_dir: "multi_reference_latents"
  gt_visual_tokens_dir: "gt_siglip_tokens"
  visual_token_key: "visual_tokens"
  visual_token_mask_key: "visual_token_mask"
  visual_tokens_per_frame_key: "tokens_per_frame"
  visual_token_frame_stride: 1
  visual_token_source_dim: 3840
  visual_token_target_dim: 4096
  cfg_dropout_enabled: true
  cfg_full_p: 0.85
  cfg_drop_text_p: 0.0
  cfg_drop_ref_p: 0.0
  cfg_drop_all_p: 0.15
  cfg_drop_planner_p: 0.0
  cfg_text_conditions_dir: "conditions"
  cfg_ref_only_conditions_dir: null
  planner_conditions_dir: "planner_conditions"
  use_online_vlm: true
  planner_vlm_inputs_dir: "planner_vlm_inputs"
  max_ref_images_per_sample: null
  reference_time_stride: 1.0
  first_frame_conditioning_p: 0.0

  vlm_placeholder_mask_key: "planner_placeholder_mask"
  vlm_hidden_layer: -1
  vlm_lm_labels_key: "labels"
  vlm_lm_loss_weight: 0.0
  train_gemma_backbone: false
  freeze_vlm_vision_tower: true
  freeze_vlm_multi_modal_projector: true

  planner_token_count: 2048
  planner_cross_attention_heads: 16
  planner_cross_attention_dropout: 0.0
  planner_zero_init_cross_attention: true
  planner_ffn_multiplier: 4.0
  planner_ffn_dropout: 0.0
  planner_zero_init_ffn: true
  planner_slot_encoding: true
  planner_slot_init_std: 1.0e-4
  planner_slot_init_seed: 0
  planner_source_dim: 3840
  predicted_visual_token_key: "predicted_visual_tokens"
  predicted_visual_token_mask_key: "predicted_visual_token_mask"
  planner_mse_weight: 1.0
  flow_loss_weight: 1.0
  freeze_transformer: true
  train_text_connector: true

optimization:
  learning_rate: 5e-5
  steps: 5000
  batch_size: 8
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "linear"
  scheduler_params: {}
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: null
  load_text_encoder_in_8bit: false
  offload_optimizer_during_validation: false

data:
  preprocessed_data_root: "/mnt/workspace/litengjie/my_dataset/overfit_100/.precomputed"
  num_dataloader_workers: 2

validation:
  interval: null
  skip_initial_validation: true
  generate_audio: false
  generate_video: true

checkpoints:
  interval: 100
  keep_last_n: 3
  precision: "bfloat16"
  no_resume: false
  save_training_state: "minimal"

hub:
  push_to_hub: false
  hub_model_id: null

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

wandb:
  enabled: false
  project: "ltx2-multiref-overfit"
  entity: null
  tags:
    - "multi-reference"
    - "stage2-planner"
    - "overfit100"
  log_validation_videos: false

seed: 42
output_dir: "/mnt/workspace/litengjie/ltx2_multiref_overfit_stage2_100"
