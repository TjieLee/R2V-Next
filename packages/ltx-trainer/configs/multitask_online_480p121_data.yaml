# Raw annotations are read-only. Generated manifests and indexes must be written
# to an explicitly allowed output path.
data_root: null

datasets:
  - name: "i2i_train"
    task: "i2i"
    dataset_type: "I2IDataset"
    ann_path: "/mnt/workspace/liutao/data_process_one2x/r2i_train_data.jsonl"
    data_root: null

  - name: "r2v_opens2v"
    task: "r2v"
    dataset_type: "OpenS2VDataset"
    ann_path: "/mnt/workspace/liutao/data_process_one2x/opens2v_train_data.parquet"
    data_root: null

  - name: "r2v_phantom"
    task: "r2v"
    dataset_type: "PhantomDataset"
    ann_path: "/mnt/workspace/liutao/phantom_data/train_data.json"
    data_root: "/mnt/workspace/liutao/phantom_data"
    adapter:
      video_field: "video_path"
      caption_field: "metadata.video_caption"
      reference_field: "cropped_ref_paths"
      require_cross_pair: true
      crop_field: null
      clip_start_field: null
      clip_end_field: null
      max_reference_images: 4

online_sampling:
  image_ratio: 0.30
  video_ratio: 0.70
  video_source_ratios:
    r2v_opens2v: 0.50
    r2v_phantom: 0.50

online_augmentation:
  enabled: true
  target:
    random_resized_crop_scale: [0.90, 1.00]
    horizontal_flip_probability: 0.50
    color_jitter_probability: 0.20
    color_jitter_strength: 0.10
  reference:
    random_resized_crop_scale: [0.80, 1.00]
    horizontal_flip_probability: 0.50
    color_jitter_probability: 0.30
    color_jitter_strength: 0.10
    blur_probability: 0.05
    jpeg_probability: 0.10
    random_erasing_probability: 0.05
