name: Semantic Flow CPU Unit Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/semantic-flow-unit-tests.yml"
      - "packages/ltx-core/**"
      - "packages/ltx-trainer/**"
  push:
    paths:
      - ".github/workflows/semantic-flow-unit-tests.yml"
      - "packages/ltx-core/**"
      - "packages/ltx-trainer/**"

jobs:
  semantic-flow-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.1 torchvision==0.22.1 torchaudio==2.7.1
          python -m pip install -e packages/ltx-core -e packages/ltx-trainer pytest

      - name: Require Gemma3 full/sliding mask compatibility
        run: |
          pytest -q \
            packages/ltx-trainer/tests/test_gemma3_attention_masks.py::test_small_transformers_gemma3_forward_accepts_full_sliding_mask_mapping

      - name: Require semantic-flow production guards
        run: |
          pytest -q \
            packages/ltx-trainer/tests/test_gemma3_attention_masks.py::test_teacher_masks_keep_evidence_bidirectional_and_queries_local \
            packages/ltx-trainer/tests/test_semantic_flow_architecture.py::test_eval_tiny_gemma_teacher_executes_manual_checkpointing_and_backpropagates \
            packages/ltx-trainer/tests/test_reference_rope_layout.py \
            packages/ltx-trainer/tests/test_semantic_flow_architecture.py::test_semantic_flow_smoke_marker_binds_code_configs_checkpoints_and_real_inference \
            packages/ltx-trainer/tests/test_semantic_flow_architecture.py::test_semantic_flow_runtime_lock_requires_exact_environment_and_fsdp_roundtrip

      - name: Run semantic-flow CPU tests
        run: |
          pytest -q \
            packages/ltx-trainer/tests/test_semantic_flow_architecture.py \
            packages/ltx-trainer/tests/test_parallel_manifest_builder.py \
            packages/ltx-trainer/tests/test_gemma3_attention_masks.py \
            packages/ltx-trainer/tests/test_reference_rope_layout.py
